ernestdefoe-roster:
  forum:
    title: Roster
    intro: Every team, roster and player. Pick a club to see who is on it.
    empty: Nothing has been synced yet. An administrator picks the leagues to carry, and the rosters arrive on the next hourly sync.
    no_team: There is no club at this address.
    no_roster: No roster has been fetched for this club yet.

    team_count: "{count, plural, one {# team} other {# teams}}"

    meta:
      index_title: Rosters
      team_title: "{team} roster"
      player_title: "{player} — {team}"

    crests:
      programs: "{count, plural, one {<b>#</b> program} other {<b>#</b> programs}}"
      players: "{count, plural, one {<b>#</b> player} other {<b>#</b> players}}"

    jersey: "No."
    player: Player
    position: Position
    class: Class
    height: Height
    weight: Weight
    hometown: Hometown

    group:
      offense: Offense
      defense: Defense
      specialists: Specialists
      other: Other

    player_page:
      not_found: There is no player at this address.
      height: Height
      weight: Weight
      class: Class
      hometown: Hometown
      college: College
      age: Age
      status: Status
      next_game: "Next game:"
      time_tba: time TBA
      about: About
      wikipedia: Read more on Wikipedia
      highlights: Highlights
      play: "Play: {title}"
      watch_on_espn: Watch on ESPN
      career: Career stats
      recent_games: Recent games
      news: News
      espn_profile: Full profile on ESPN
      nothing_yet: Nothing has been written about this player yet. His stats, clips and news appear here as they're published.
      gathering: Gathering his stats, clips and news…

    class_year:
      freshman: Freshman
      sophomore: Sophomore
      junior: Junior
      senior: Senior
      super_senior: Super senior

  api:
    independent: Independent
    crest_wall:
      name: Crest wall
      league_label: League key
      league_help: Which competition's clubs to show — cfb, nfl, nba…
      caption_label: Caption
      caption_default: Every program in the country
      caption_help: Leave empty for no caption.
      counts_label: Show the numbers
      counts_help: Programs and players actually held, counted at render — never a number typed in by hand.
      rows_label: Rows

  admin:
    leagues_label: Leagues to carry
    leagues_help: >-
      Tick the competitions this site should carry rosters for. They all come
      from ESPN, which needs no key.
      College football brings a class year with it; professional leagues have
      no classes, so their rosters have no Class column.
    leagues_empty: >-
      No leagues were sent by the server. That is a broken install rather than
      an empty list — every build ships at least the ESPN competitions.
